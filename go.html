<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F1EC">
<title>Indo para a oferta… | Lojão Preço Caído</title>
<link rel="icon" href="./assets/icon.png">
<link rel="preload" href="./data/produtos-ml.json" as="fetch" crossorigin>
<link rel="preload" href="./data/produtos-shopee.json" as="fetch" crossorigin>
<style>
  :root{--laranja:#E8400C;--preto:#141414;--creme:#F4F1EC;--branco:#fff;--cinza:#5A5A5A;--cinza-claro:#E4DFD7}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--creme);color:var(--preto);font:400 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  main{width:100%;max-width:380px;text-align:center}
  .logo{display:block;height:44px;width:auto;max-width:80%;margin:0 auto 22px}
  .card{background:var(--branco);border:1px solid var(--cinza-claro);border-radius:18px;padding:16px;box-shadow:0 10px 30px -18px rgba(0,0,0,.25)}
  .img{aspect-ratio:1;width:100%;max-width:220px;margin:0 auto 14px;border-radius:12px;background:var(--creme);overflow:hidden;display:flex;align-items:center;justify-content:center}
  .img img{width:100%;height:100%;object-fit:contain}
  .title{margin:0 0 6px;font-weight:600;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:1.35em}
  .price{margin:0;font-weight:800;font-size:22px;color:var(--laranja)}
  .price s{font-weight:400;font-size:13px;color:var(--cinza);margin-right:6px}
  .status{margin:18px 0 12px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--cinza);font-size:14px}
  .spin{width:18px;height:18px;border:2.5px solid var(--cinza-claro);border-top-color:var(--laranja);border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;width:100%;padding:0 20px;border-radius:999px;background:var(--laranja);color:#fff;font-weight:700;text-decoration:none}
  .btn:hover{background:#C9370A}
  .sk{background:linear-gradient(90deg,var(--cinza-claro) 25%,#EEE9E1 50%,var(--cinza-claro) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:6px}
  @keyframes sh{to{background-position:-200% 0}}
  .title.sk{height:1.35em;width:80%;margin:0 auto 8px}
  .price.sk{height:24px;width:40%;margin:0 auto}
  [hidden]{display:none!important}
  /* animações de entrada */
  .logo{animation:cai .45s cubic-bezier(.3,1.6,.5,1) both}
  .card{position:relative;animation:despenca .5s cubic-bezier(.2,.8,.3,1) .1s both}
  @keyframes cai{from{opacity:0;transform:translateY(-30px) rotate(-8deg)}}
  @keyframes despenca{0%{opacity:0;transform:translateY(-80px) rotate(-6deg) scale(.92)}55%{opacity:1;transform:translateY(8px) scale(1.03,.95)}75%{transform:translateY(-4px) scale(.99,1.02)}100%{transform:none}}
  .badge{position:absolute;top:12px;left:12px;z-index:1;background:var(--laranja);color:#fff;border-radius:10px;padding:6px 9px;font:900 16px/1 system-ui,sans-serif;animation:pow .35s cubic-bezier(.3,1.9,.5,1) .45s both}
  @keyframes pow{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.3) rotate(8deg)}100%{transform:none}}
  .img img{animation:surge .4s ease-out .3s both}
  @keyframes surge{from{opacity:0;transform:scale(.7) rotate(-6deg)}}
  .price s{position:relative;color:var(--cinza);font-size:13px;margin-right:6px;text-decoration:none}
  .price s::after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:2px;background:var(--laranja);transform-origin:0 50%;animation:risca .3s ease-out .45s both}
  @keyframes risca{from{transform:scaleX(0)}}
  .price span{display:inline-block;font-weight:800;font-size:20px;color:var(--laranja)}
  .price span.bate{animation:bate .35s cubic-bezier(.3,1.8,.5,1)}
  @keyframes bate{50%{transform:scale(1.25) translateY(3px)}}
  .barra{height:4px;border-radius:4px;background:var(--cinza-claro);overflow:hidden;margin:0 0 12px}
  .barra i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--laranja),#ffb200);transform-origin:0 50%;transform:scaleX(0)}
  .barra.vai i{transition:transform var(--t,1.3s) linear;transform:none}
  .btn{animation:pulsa 1s ease-in-out infinite}
  @keyframes pulsa{50%{transform:scale(1.04);box-shadow:0 0 0 8px rgba(232,64,12,.15)}}
  @media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}

  @media (prefers-reduced-motion:reduce){.spin,.sk{animation:none}}
  @media (max-height:560px){.img{max-width:140px}.logo{height:34px;margin-bottom:14px}}
</style>
</head>
<body>
<main>
  <img class="logo" src="./assets/logo_horizontal.png" alt="Lojão Preço Caído">
  <div class="card">
    <div class="img" id="img"></div>
    <p class="title sk" id="title"></p>
    <p class="price sk" id="price"></p>
  </div>
  <div class="status" id="status"><span class="spin" aria-hidden="true"></span><span id="msg">Levando você para a oferta…</span></div>
  <div class="barra" id="barra"><i></i></div>
  <a class="btn" id="btn" href="./" hidden>Ir para a oferta</a>
</main>
<script>
(function () {
  var id = new URLSearchParams(location.search).get('id');
  var home = './';
  var go = function (u) { location.replace(u); };
  if (!id) return go(home);

  var $ = function (s) { return document.getElementById(s); };
  var brl = function (v) { try { return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); } catch (e) { return 'R$ ' + v; } };
  var get = function (u) { return fetch(u).then(function (r) { return r.ok ? r.json() : []; }).catch(function () { return []; }); };

  // fallback: se algo travar, ao menos manda para a home
  var guard = setTimeout(function () { go(home); }, 8000);

  Promise.all([get('./data/produtos-ml.json'), get('./data/produtos-shopee.json')]).then(function (r) {
    clearTimeout(guard);
    var p = [].concat(r[0] || [], r[1] || []).find(function (x) { return x && x.id === id; });
    if (!p || !p.link) return go(home);

    // redireciona primeiro; o visual é só enquanto a loja carrega
    var calmo = matchMedia('(prefers-reduced-motion: reduce)').matches, T = calmo ? 600 : 1300;
    setTimeout(function () { go(p.link); }, T);
    var ba = $('barra'); ba.style.setProperty('--t', T + 'ms'); requestAnimationFrame(function () { requestAnimationFrame(function () { ba.classList.add('vai'); }); });

    try {
      var btn = $('btn'); btn.href = p.link; btn.hidden = false;
      $('msg').textContent = 'Indo para ' + (p.loja === 'ml' ? 'o Mercado Livre' : p.loja === 'shopee' ? 'a Shopee' : 'a loja') + '…';
      var t = $('title'); t.classList.remove('sk'); t.textContent = p.titulo || '';
      var preco = p.preco_pix != null ? p.preco_pix : p.preco;
      var pr = $('price'); pr.classList.remove('sk');
      if (typeof preco === 'number') {
        pr.innerHTML = (p.preco_antigo ? '<s></s>' : '') + '<span></span>';
        if (p.preco_antigo) pr.querySelector('s').textContent = brl(p.preco_antigo);
        var sp = pr.querySelector('span'), suf = p.preco_pix != null ? ' no Pix' : '';
        sp.textContent = brl(preco) + suf;
        if (p.preco_antigo > preco && !calmo) {
          var b = document.createElement('span'); b.className = 'badge';
          b.textContent = '↓-' + Math.round((1 - preco / p.preco_antigo) * 100) + '%';
          $('img').parentNode.appendChild(b);
          // preço despenca do antigo até o atual
          var t0 = performance.now() + 450, de = p.preco_antigo;
          sp.textContent = brl(de) + suf;
          (function passo(t) {
            var k = Math.max(0, Math.min(1, (t - t0) / 550)), e = k * k * (3 - 2 * k);
            sp.textContent = brl(Math.round((de - (de - preco) * e) * 100) / 100) + suf;
            if (k < 1) requestAnimationFrame(passo); else sp.classList.add('bate');
          })(performance.now());
        }
      } else pr.hidden = true;
      if (p.img) {
        var im = new Image(); im.alt = ''; im.referrerPolicy = 'no-referrer'; im.decoding = 'async';
        im.src = p.img; $('img').appendChild(im);
      } else $('img').hidden = true;
    } catch (e) {}
  });
})();
</script>
</body>
</html>
